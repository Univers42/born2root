# born2root — the SERVER profile: a backend-only machine that runs grobase.
#
#   make all B2B_CONFIG=profiles/server.toml
#
# Same schema as born2root.toml (utils/b2b_config.py reads both; the shipped
# file's comments explain every key). What differs, and why:
#
#   [features]   nvim and the whole workstation set are OFF, dc-full is ON.
#                A server has no editor; what it has is Kong, the identity
#                plane, seven engines, object storage, observability, a
#                backup job, the /var garbage collector, Tailscale and
#                cloudflared. `make packages FEATURE=dc-full` lists what
#                that pulls. Frontends (groot, osionos, transcendence) live
#                on the host and talk to the gateway.
#
#   [disk]       50 GB, and / and /home give up share, /var takes it. The
#                workstation image spent 11 GB on / and 6.4 GB on /home at
#                44 GB for nvim, npm caches and VS Code servers; without
#                them / needs 2 GB (3.6 GiB here) and /home only holds its
#                floor, 1 GB for the VS Code and Inception reservations.
#                /var is the `rest` volume, so every point of share they
#                release lands where Docker, the engines and their data
#                live: 34 GiB of 50, for 16.3 GB the dc-full set needs.
#                Measured layout:
#                `make partitions B2B_CONFIG=profiles/server.toml SIZE_B2B=50`.
#
#   [vm] name    "baas", not "debian": a different machine under
#                disk_images/, so the destructive targets never confuse the
#                two and both builds can be kept.
#
#   [vm] backend "qemu", not "auto". With both hypervisors installed and no
#                terminal to ask on -- every unattended build -- auto picks
#                VirtualBox, and the 2026-09-20 server build started there
#                before it was caught. This machine is built on KVM: virtio
#                disk and NIC, -cpu host, /dev/kvm granted by ACL on the
#                seat. A profile that is meant to be reproducible does not
#                leave that to a prompt.
#
#   [vm] ram_mb 14336, not "auto". auto is 25% of the host clamped to
#                8192 MB, sized for a desktop guest: on this 31.9 GB seat
#                it gave 7982 MB, grobase's stack used 5500 of it
#                (2026-10-07, `free -m` in the guest) and 2238 MB was
#                left, while one graph_render worker slot is 4.32 GiB
#                inside its 8g container cap (graph_render
#                scripts/service.sh). 14 GiB holds both; a fully touched
#                guest still leaves the host ~7.8 GB.
#
# Everything else is the shipped default. Credentials are the temporary
# ones; change them here as in born2root.toml.

[vm]
name    = "baas"
backend = "qemu"
# The 1 TB disk, not the 98 GB one the repo sits on: a max-tier datacenter is
# ~16 GB the moment it boots and keeps growing as the engines fill /var, and
# `make space` counts the repo tree, not this. Empty would mean disk_images/
# inside the repo. An existing VM is NOT moved by editing this -- the registry
# at disk_images/.vm_path.baas wins so a built guest is never orphaned -- so
# relocate one with `make all VM_PATH=…` or by moving the directory and that
# file together. This is where that registry says baas lives.
path    = "/mnt/storage/virtual_machines"
disk_gb = 80
# On a 7.6 GB campus seat: 4048 left the host 3.6 GB and swapping (2026-10-08).
# 3 GB is grobase's own figure for the pro tier below (cost-analysis.md).
ram_mb  = 3072
cpus    = "auto"
profile = "auto"
ai_mode = "off"

[ai]
host_models = false
models      = ["unsloth/Qwen3-Coder-30B-A3B-Instruct-GGUF:UD-Q3_K_XL"]
models_dir  = "/sgoinfre/students/$USER/llm"
budget_gb   = 15
llama_cpp   = "b10970"
gpu         = "auto"
context     = 32768
bind        = "127.0.0.1:8012"
expose      = false

[system]
hostname        = ""
locale          = "en_US.UTF-8"
keymap          = "es"
timezone        = "Europe/Madrid"
mirror          = "deb.debian.org"
root_password   = "temproot123"
luks_passphrase = "tempencrypt123"

[users.dlesieur]
password = "tempuser123"
fullname = ""
sudo     = true
groups   = ["docker"]
ssh_keys = []
nvim     = false

[packages]
apt = []

[features]
# workstation: off
nvim           = false
nvim-extras    = false
webstack       = false
nodejs         = false
pytools        = false
devtools-extra = false
claude-code    = false
# The browser the agents drive. Off here for the same reason as the rows above:
# a server image has no editor and no agent, and the feature is `full` tier, so
# leaving it to size would switch on 700 MB of chromium for a machine that will
# never call it -- and it requires devtools-extra, which is off here. A host that
# does want agents on its server image asks by name: FEATURES="+playwright".
playwright     = false
# the machine
docker         = true
# the datacenter (a bundle: generate/feature_profile.sh expands it)
dc-full        = true
# Not on a 7.6 GB seat: these are the max tier's add-ons (engines: mssql with a
# 2 GB cap, cockroach; observability: loki, prometheus, grafana). Together
# grobase measures max at 3128 MiB idle and asks 6 GB / 8 vCPU.
dc-db-cockroach  = false
dc-db-mssql      = false
dc-observability = false
# graph_render's motor: its own row, in no dc-* bundle (generate/feature_profile.sh)
dc-graph-render = true

[policy.password]
max_days    = 30
min_days    = 2
warn_days   = 7
min_length  = 10
min_upper   = 1
min_lower   = 1
min_digit   = 1
max_repeat  = 3
min_changed = 7

[policy.sudo]
tries           = 3
badpass_message = "Wrong password. Access denied!"
log_dir         = "/var/log/sudo"

[policy.ssh]
password_login = true

[policy.monitoring]
interval_min = 10

[network]
# No forward for groot's frontends (website 4322, osionos 3001/3002/3003, the
# bridges 4000/4100/4200, auth-gateway 8787): they run on the HOST against this
# guest's grobase (groot: make link, over the ssh entry), and a hostfwd here
# would hold the host port each of them must bind. None for Kong 8000, its
# admin 8001 or Mailpit 8025 either: they bind the guest's loopback, which a
# hostfwd never reaches (it targets the NIC), so those entries only squatted
# the ports a grobase running on the host publishes. Removed 2026-10-08.
forwards = [
  { name = "ssh",                      guest = 4242,  host = 4242  },
  { name = "http",                     guest = 80,    host = 8082  },
  { name = "https",                    guest = 443,   host = 8443  },
  { name = "inception-static",         guest = 8090,  host = 8090  },
  { name = "inception-adminer",        guest = 8080,  host = 8081  },
  { name = "inception-ftp",            guest = 21,    host = 2121  },
  { name = "inception-ftp-pasv-21000", guest = 21000, host = 21000 },
  { name = "inception-ftp-pasv-21001", guest = 21001, host = 21001 },
  { name = "inception-ftp-pasv-21002", guest = 21002, host = 21002 },
  { name = "inception-ftp-pasv-21003", guest = 21003, host = 21003 },
  { name = "inception-ftp-pasv-21004", guest = 21004, host = 21004 },
  { name = "inception-ftp-pasv-21005", guest = 21005, host = 21005 },
  { name = "inception-ftp-pasv-21006", guest = 21006, host = 21006 },
  { name = "inception-ftp-pasv-21007", guest = 21007, host = 21007 },
  { name = "inception-ftp-pasv-21008", guest = 21008, host = 21008 },
  { name = "inception-ftp-pasv-21009", guest = 21009, host = 21009 },
  { name = "inception-ftp-pasv-21010", guest = 21010, host = 21010 },
  { name = "docker",                   guest = 5000,  host = 5000  },
  { name = "mariadb",                  guest = 3306,  host = 3306  },
  { name = "redis",                    guest = 6379,  host = 6379  },
  { name = "frontend",                 guest = 5173,  host = 5173  },
  { name = "backend",                  guest = 3000,  host = 3000  },
  { name = "vault",                    guest = 18200, host = 18200 },
]

# ── [dc]: what the platform provisioners get on top of the features ──
# cors_origins: the Laboratory bench on :5180 (5173 is QEMU's own forward);
# its hostile origin (:5181) is deliberately absent, so the "blocked as
# expected" probe stays meaningful.
[dc]
cors_origins = ["http://localhost:5180", "http://127.0.0.1:5180"]
# backup_dest: where the copy has lived since 2026-10-07, on /mnt/storage
# (nvme1n1, 451 GB free) because nothing of the datacenter goes in /home (the
# ubuntu-vg volume on the other NVMe, 60 GB free). That is the disk the guest
# lives on too, so the copy survives a broken guest, not a dead nvme1n1: the
# next tier is a USB disk or a remote (backup_pull.sh). The shipped default is
# a 42 campus /sgoinfre path that does not exist on a personal machine.
# Absolute paths only.
backup_dest = "/mnt/storage/b2b-backups/baas"
# the full backend: pro + analytics, observability, functions, engines.
# Frontends and tenant apps stay out whatever the tier.
package = "pro"

[disk]
swap_mb = "auto"
volumes = [
  { name = "root",    mount = "/",        floor_mb = 2816, share = 3,      cap_mb = 30720  },
  { name = "home",    mount = "/home",    floor_mb = 1024, share = 0,      cap_mb = 102400 },
  { name = "opt",     mount = "/opt",     floor_mb = 512,  share = 1,      cap_mb = 20480  },
  { name = "srv",     mount = "/srv",     floor_mb = 256,  share = 0,      cap_mb = 10240  },
  { name = "tmp",     mount = "/tmp",     floor_mb = 512,  share = 1,      cap_mb = 10240  },
  { name = "var-log", mount = "/var/log", floor_mb = 1024, share = 2,      cap_mb = 20480  },
  { name = "var",     mount = "/var",     floor_mb = 2048, share = "rest"                  },
]
