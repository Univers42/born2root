# born2root — the SERVER profile: a backend-only machine that runs grobase.
#
#   make all B2B_CONFIG=profiles/server.toml
#
# Same schema as born2root.toml (utils/b2b_config.py reads both; the shipped
# file's comments explain every key). What differs, and why:
#
#   [features]   nvim and its extras are on, for the login too. webstack,
#                pytools and playwright are off. nodejs, devtools-extra and
#                claude-code stay on, as baas had them (2026-10-13
#                features.status).
#                dc-full is ON: Kong and the WAF, the identity plane, every
#                dc-db-* engine, realtime, vault, object storage,
#                observability, restic, Tailscale and cloudflared (the
#                BUNDLES in generate/feature_profile.sh), plus graph_render's
#                motor. `make packages FEATURE=dc-full` lists what that
#                pulls. Frontends (groot, osionos, transcendence) live on the
#                host and talk to the gateway.
#
#   [disk]       120 GB, and / and /home give up share, /var takes it. / is
#                charged 3120 MB with the editor (5.5 GiB here), /home
#                1153 MB: the editor, the VS Code and Inception
#                reservations (its volume says why the floor is 2 GB
#                anyway). /var is the `rest`
#                volume, so every point of share they release lands where
#                Docker, the engines and their data live: 94 GiB of 120,
#                for the 16417 MB the dc rows are charged. Measured, both
#                with B2B_CONFIG=profiles/server.toml SIZE_B2B=120:
#                `make features` (the charges), `make partitions` (the layout).
#                vm.disk_gb sizes a NEW build. An existing VM is grown in
#                place, offline: qemu_vm.sh grow-disk, then make grow_root
#                (the window, in order, is in grow_root.sh's header).
#
#   [vm] name    "baas", not "debian": a different machine under
#                disk_images/, so the destructive targets never confuse the
#                two and both builds can be kept.
#
#   [vm] backend "qemu", not "auto". With both hypervisors installed and no
#                terminal to ask on -- every unattended build -- auto picks
#                VirtualBox, and the 2026-09-20 server build started there
#                before it was caught. This machine is built on KVM: virtio
#                disk and NIC, -cpu host, /dev/kvm granted by ACL on the
#                seat. A profile that is meant to be reproducible does not
#                leave that to a prompt.
#
#   [vm] ram_mb 14336, not "auto". auto is 25% of the host clamped to
#                8192 MB, sized for a desktop guest: on this 31.9 GB seat
#                it gave 7982 MB, grobase's stack used 5500 of it
#                (2026-10-07, `free -m` in the guest) and 2238 MB was
#                left, while one graph_render worker slot is 4.32 GiB
#                inside its 8g container cap (graph_render
#                scripts/service.sh). 14 GiB holds both; a fully touched
#                guest still leaves this host 17593 MB (31929 - 14336, before
#                QEMU's own overhead). qemu_vm.sh refuses a value above the
#                host's RAM: a smaller seat lowers it here. A school seat's
#                RAM is not measured yet (doc/rebuild-baas-at-school.md).
#
#   [vm] ide_disk_gb 40, not 0: the osionos IDE sandbox's own disk. First
#                boot makes it ide_crypt, XFS with prjquota at
#                /var/lib/docker-ide (setup/install/dc/install_ide_disk.sh):
#                the quotas that cap a sandbox's layers need XFS, and a
#                sandbox that fills its disk does not fill /var with it.
#
#   [network]    ssh and grobase's WAF, the only ports baas listens on
#                outside its loopback. A guest that is already running keeps
#                every UFW rule an older profile opened: `make firewall`
#                deletes those (setup/host/firewall_guest.sh).
#
#   [dc]         the grobase commit baas runs, the grobase keys it had set
#                by hand, its tailnet name and Funnel, the secrets file and
#                where backups land. With the carried restic repository,
#                `make datacenter` brings baas's platform back from these
#                (doc/rebuild-baas-at-school.md).
#
#   [host]       autostart: `make all` makes the VM a user service of the
#                host's login, with an hourly backup pull (make autostart).
#
# Everything else is born2root.toml's default, credentials included: the
# temporary ones, changed in the guest (`passwd`) after the build. They
# expire after [policy.password] max_days.

[vm]
name    = "baas"
backend = "qemu"
# Tried in order, the first that exists and is writable wins (else the first
# that can be created). /sgoinfre only: on the 42 Madrid seats home has
# ~650 MB free and /goinfre is too small and wiped. A sibling of the repo,
# never the repo itself: fclean empties VM_PATH. Never disk_images/: a max-tier
# datacenter is ~16 GB the moment it boots and grows as the engines fill /var.
# An existing VM is NOT moved by editing this -- disk_images/.vm_path.baas
# wins so a built guest is never orphaned; `make all VM_PATH=…` relocates.
path    = ["/sgoinfre/students/$USER/virtual_machines"]
# Editing disk_gb does not resize an existing VM (the header says what does).
disk_gb = 120
ide_disk_gb = 40
ram_mb  = 14336
cpus    = "auto"
profile = "auto"
ai_mode = "off"

[ai]
host_models = false
models      = ["unsloth/Qwen3-Coder-30B-A3B-Instruct-GGUF:UD-Q3_K_XL"]
models_dir  = "/sgoinfre/students/$USER/llm"
budget_gb   = 15
llama_cpp   = "b10970"
gpu         = "auto"
context     = 32768
bind        = "127.0.0.1:8012"
expose      = false

[system]
hostname        = ""
locale          = "en_US.UTF-8"
keymap          = "es"
timezone        = "Europe/Madrid"
mirror          = "deb.debian.org"
root_password   = "temproot123"
luks_passphrase = "tempencrypt123"

[users.dlesieur]
password = "tempuser123"
fullname = ""
sudo     = true
groups   = ["docker"]
# The two keys baas's authorized_keys held (2026-10-13 audit), so both
# machines that reach it today reach the rebuilt one. Public keys: safe here.
ssh_keys = [
  "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIG+mTmZXgfPrUtf20VA/XqDO/4vAAIHwdTMauW6S8HDv dlesieur@dlesieur42",
  "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDpG2f3FkMoztyY5+MuqGPnJ3SwsTTJcNncEtPAuJH6x dlesieur@dlesieur",
]
# The build has the editor (features.nvim = true), so the login gets it.
nvim     = true

[packages]
apt = []

[features]
# the editor, node, the extra dev tools and Claude Code
nvim           = true
nvim-extras    = true
webstack       = false
nodejs         = true
pytools        = false
devtools-extra = true
claude-code    = true
# The browser the agents drive: off. The feature is `full` tier, so leaving it
# to size would switch on 700 MB of chromium on a server nothing browses from.
# A host that wants it asks by name: FEATURES="+playwright".
playwright     = false
# the machine
docker         = true
# Inception rides along (inception-data comes on with docker): its nginx
# binds the guest's 443 on loopback and the NAT address only, beside the
# tailnet's own 443 (deploy_inception.sh), and gets the inception-* forwards.
# the datacenter (a bundle: generate/feature_profile.sh expands it)
dc-full        = true
# The max tier's heavy add-ons (engines: mssql with a 2 GB cap, cockroach;
# observability: loki, prometheus, grafana). dc-full already holds all three;
# they are named so the cost stays in sight: grobase measures max at 3128 MiB
# idle and asks 6 GB / 8 vCPU; ram_mb above covers the 6 GB.
dc-db-cockroach  = true
dc-db-mssql      = true
dc-observability = true
# graph_render's motor: its own row, in no dc-* bundle (generate/feature_profile.sh)
dc-graph-render = true

[policy.password]
max_days    = 30
min_days    = 2
warn_days   = 7
min_length  = 10
min_upper   = 1
min_lower   = 1
min_digit   = 1
max_repeat  = 3
min_changed = 7

[policy.sudo]
tries           = 3
badpass_message = "Wrong password. Access denied!"
log_dir         = "/var/log/sudo"

[policy.ssh]
password_login = true

[policy.monitoring]
interval_min = 10

[network]
# What baas serves, nothing else: each entry is a QEMU hostfwd on the host's
# 127.0.0.1 (qemu_vm.sh reads this list at every start) and a UFW rule in the
# guest. On 2026-10-13 baas listened outside its loopback and tailscale0 on
# 4242, 8880 and 8443 only (ss -ltnH); Kong 8000, the engines (3306, 6379,
# 5432, 27017, ...), realtime and mailpit bind the guest's loopback, which a
# hostfwd never reaches -- reach them over ssh. 5000, 3306, 6379, 5173, 3000
# and 18200 were removed then: nothing answered them where a hostfwd arrives,
# and each held a host port. Inception's 443, 8090 and 8080 came back with
# `make inception` (2026-10-14); its FTP (21, 21000-21010) did not, twelve
# host ports for the subject's bonus. groot's frontends (website 4322, osionos 3001-3003, the
# bridges 4000/4100/4200, auth-gateway 8787) run on the HOST against this
# guest's grobase (groot: make link, over ssh), so they get no forward
# either.
forwards = [
  { name = "ssh",   guest = 4242, host = 4242 },
  # grobase's WAF, on the guest's 0.0.0.0:8880 and :8443.
  { name = "http",  guest = 8880, host = 8082 },
  { name = "https", guest = 8443, host = 8443 },
  # Inception (make inception): nginx, the static site, Adminer.
  { name = "inception-https",   guest = 443,  host = 8444 },
  { name = "inception-static",  guest = 8090, host = 8090 },
  { name = "inception-adminer", guest = 8080, host = 8081 },
]

# ── [dc]: what the platform provisioners get on top of the features ──
# cors_origins: the Laboratory bench on :5180; its hostile origin (:5181) is
# deliberately absent, so the "blocked as expected" probe stays meaningful.
[dc]
cors_origins = ["http://localhost:5180", "http://127.0.0.1:5180"]
# backup_dest: where `make backup` copies the restic repository, tried in
# order like vm.path. On the seat that built baas it is /mnt/storage, the disk
# the guest lives on too, so the copy survives a broken guest, not a dead
# disk: the next tier is a USB disk or a remote (backup_pull.sh). At school
# it is sgoinfre, which survives the /goinfre wipes and follows the login;
# carry an older repository in there before `make datacenter` restores.
backup_dest = ["/mnt/storage/b2b-backups/baas", "/sgoinfre/students/$USER/b2b-backups/baas"]
# secrets_file: baas's keys (RESTIC_PASSWORD, TS_AUTHKEY, ...), mode 600, never
# in the repo: dc_lib.sh's own default, under $HOME so the wipes spare it.
# Named rather than left empty: a set path that is missing makes `make
# backup` mint a new RESTIC_PASSWORD there instead of reading the old one.
secrets_file = "$HOME/.config/born2root/b2b-secrets"
# Those keys' team copy (make secrets_push / secrets_pull), as in born2root.toml.
vault = "univers42/born2root/shared"
# the full backend: pro + analytics, observability, functions, engines.
# Frontends and tenant apps stay out whatever the tier.
package = "max"
# Followed, not pinned: every install (first boot, each `make grobase`)
# takes main's newest commit and records it in /etc/b2b/grobase.conf.
# baas ran dab5f43060aab2914183173c91dc7a39a7aab9f6 on 2026-10-13; put a
# full SHA back here to pin one.
grobase_ref = "main"
# The school's baas is baas.tail10f2ea.ts.net; dlesieur42-1 is the one at
# home, a separate node since 2026-10-14 -- two machines asking for one name
# leave the second with a suffix (make tailnet stops and says so). The name is
# in REALTIME_ALLOWED_ORIGINS below; make tailnet puts it in kong.yml. A
# rebuild must have the old node removed from the tailnet before it can take
# the name back.
tailnet_hostname = "baas"
# baas serves its WAF on the open Internet through Tailscale Funnel; `make
# datacenter` opens it again (funnel.sh: two console switches, once).
funnel = true

# The grobase keys baas had set by hand (2026-10-13 audit), kept in
# /opt/grobase/.env.local so `make env` and a restore keep them. This table
# replaces the default one. CATALOG_MANAGEMENT is not written: grobase main
# no longer reads it (8b9321a6, 2026-10-14). REMOTE_ACCESS is, although
# baas lacked it: it composes docker-compose.remote-access.yml, realtime
# 4000 and mailpit 1025 on the guest's LOOPBACK, which a frontend on
# another machine reaches over an ssh LocalForward. Without it that
# frontend's realtime events and auth mail go nowhere, silently (grobase's
# own measurement, 2026-10-10). Nothing new is reachable off the guest. Not here:
# GROBASE_PUBLIC_ADDRESSES (the tailnet name and address; grobase's `make
# expose` writes it) and every secret (the secrets file and the snapshot's
# .env.local carry those; --check refuses a secret-looking name).
[dc.grobase_env]
DATA_PLANE_ADMIN_BYPASS         = "1"
DATA_PLANE_FEATURES             = "--features dynamodb"
DATA_PLANE_IMAGE_SUFFIX         = "-dynamodb"
DYNAMODB_ENGINE_ENABLED         = "1"
DATA_PLANE_PER_TABLE_ISOLATION  = "1"
RUST_DATA_PLANE_FORWARD_ENGINES = "postgresql,cockroachdb,mongodb,mysql,mariadb,redis,sqlite,mssql,http,dynamodb"
REALTIME_ALLOWED_ORIGINS        = "https://localhost:3000,https://localhost:3100,https://localhost:3001,http://localhost:5173,https://baas.tail10f2ea.ts.net"
ORG_MODEL_ENABLED               = "true"
RBAC_HIERARCHY_ENABLED          = "true"
ENVIRONMENTS_ENABLED            = "true"
GROUPS_ENABLED                  = "true"
INVITES_ENABLED                 = "true"
USER_PUBKEYS_ENABLED            = "true"
REMOTE_ACCESS                   = "1"

# baas was a user service of the seat's login: up at boot, stopped gracefully
# at shutdown, its backup pulled hourly. `make all` sets that up again (make
# autostart); linger and the kvm group need root and are printed, not done.
[host]
autostart = true

[disk]
swap_mb = "auto"
volumes = [
  { name = "root",    mount = "/",        floor_mb = 2816, share = 3,      cap_mb = 30720  },
  # 2048, not 1024: share = 0 means the floor is all /home ever gets. It is
  # charged 1153 MB (make features), and baas, built with the editor on, used
  # 687 MB of its 1.9 GiB (2026-10-13, df).
  { name = "home",    mount = "/home",    floor_mb = 2048, share = 0,      cap_mb = 102400 },
  { name = "opt",     mount = "/opt",     floor_mb = 512,  share = 1,      cap_mb = 20480  },
  { name = "srv",     mount = "/srv",     floor_mb = 256,  share = 0,      cap_mb = 10240  },
  { name = "tmp",     mount = "/tmp",     floor_mb = 512,  share = 1,      cap_mb = 10240  },
  { name = "var-log", mount = "/var/log", floor_mb = 1024, share = 2,      cap_mb = 20480  },
  { name = "var",     mount = "/var",     floor_mb = 2048, share = "rest"                  },
]
