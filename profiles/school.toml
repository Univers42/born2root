# born2root — the SCHOOL profile: the Born2beRoot subject and nothing else.
#
#   make all B2B_CONFIG=profiles/school.toml
#
# For an evaluation. Every mandatory setting (SSH on 4242, UFW, sudo policy,
# pwquality, AppArmor, the monitoring cron, LUKS + LVM, the hellish login
# shell) comes from b2b-mandatory, which is base and always on. What this
# file turns off is everything that is not in the subject: the WordPress
# bonus, Docker, the language toolchains, the editor layers. nvim stays: it
# is core (on in every profile, off only by name) and costs 382 MB on / at
# 15 GB, which the fit check has room for.
#
# Same schema as born2root.toml; see that file for what every key means.

[vm]
name    = "debian"
backend = "auto"
disk_gb = 15
ram_mb  = "auto"
cpus    = "auto"
profile = "auto"
ai_mode = "off"

[ai]
host_models = false
models      = ["unsloth/Qwen3-Coder-30B-A3B-Instruct-GGUF:UD-Q3_K_XL"]
models_dir  = "/sgoinfre/students/$USER/llm"
budget_gb   = 15
llama_cpp   = "b10970"
gpu         = "auto"
context     = 32768
bind        = "127.0.0.1:8012"
expose      = false

[system]
hostname        = ""
locale          = "en_US.UTF-8"
keymap          = "es"
timezone        = "Europe/Madrid"
mirror          = "deb.debian.org"
root_password   = "temproot123"
luks_passphrase = "tempencrypt123"

[users.dlesieur]
password = "tempuser123"
fullname = ""
sudo     = true
groups   = []
ssh_keys = []
nvim     = true

[packages]
apt = []

[features]
webstack       = false
docker         = false
nodejs         = false
pytools        = false
nvim-extras    = false
devtools-extra = false
claude-code    = false

[policy.password]
max_days    = 30
min_days    = 2
warn_days   = 7
min_length  = 10
min_upper   = 1
min_lower   = 1
min_digit   = 1
max_repeat  = 3
min_changed = 7

[policy.sudo]
tries           = 3
badpass_message = "Wrong password. Access denied!"
log_dir         = "/var/log/sudo"

[policy.ssh]
password_login = true

[policy.monitoring]
interval_min = 10

[network]
forwards = [
]

[disk]
swap_mb = "auto"
volumes = [
  { name = "root",    mount = "/",        floor_mb = 2816, share = 25,     cap_mb = 30720  },
  { name = "home",    mount = "/home",    floor_mb = 512,  share = 18,     cap_mb = 102400 },
  { name = "opt",     mount = "/opt",     floor_mb = 256,  share = 5,      cap_mb = 20480  },
  { name = "srv",     mount = "/srv",     floor_mb = 256,  share = 0,      cap_mb = 10240  },
  { name = "tmp",     mount = "/tmp",     floor_mb = 256,  share = 3,      cap_mb = 10240  },
  { name = "var-log", mount = "/var/log", floor_mb = 384,  share = 3,      cap_mb = 20480  },
  { name = "var",     mount = "/var",     floor_mb = 2048, share = "rest"                  },
]
