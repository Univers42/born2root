### Partitioning - FULLY AUTOMATED with Encrypted LVM
# Critical: Set automatic partitioning method
d-i partman-auto/init_automatically_partition select Guided - use entire disk and set up encrypted LVM
d-i partman-auto/method string crypto
d-i partman-crypto/passphrase password tempencrypt123
d-i partman-crypto/passphrase-again password tempencrypt123

# Skip the random data wipe — pointless in a VM (VDI is already zeroed)
# This saves 10-30+ minutes on a 32GB disk
# Both keys for compatibility: old (partman-crypto) + new trixie (partman-auto-crypto)
d-i partman-auto-crypto/erase_disks boolean false
d-i partman-crypto/erase_data boolean false

# Select the disk to partition
d-i partman-auto/disk string /dev/sda

# Force the automatic partitioning
d-i partman-auto-lvm/guided_size string max
d-i partman-auto-lvm/new_vg_name string LVMGroup
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true

# Critical: Force automatic creation of partitions
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_write_new_label boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman-crypto/confirm boolean true
d-i partman-crypto/confirm_nooverwrite boolean true

# Set the recipe for custom partitioning
# Disk: 120GB (122880MB). Boot: 500MB. Crypto/LVM: rest of disk.
# LUKS header ≈ 16MB + LVM PE alignment → we do NOT hardcode the crypto
# container size; the installer sizes the container from the second partition
# and puts the VG inside it.
#
# ── THE IMPORTANT PART: THE VOLUME GROUP IS NOT FULLY ALLOCATED ─────────────
# The goal is free extents in the VG, so any volume can be grown later without
# rebuilding the machine. Getting there is less obvious than it looks.
#
# Pinning every volume (min = priority = max) is NOT enough, and this was
# measured, not assumed: with every LV pinned and none using -1, partman still
# handed the entire remainder to the LAST volume in the recipe. /var/log was
# asked for 3072 MB and got 20.34 GB, and `vgs` reported VFree = 0 — the exact
# problem the pinning was supposed to solve.
#
# partman insists on placing all the space somewhere. So it is given somewhere
# harmless: a decoy volume, `spare`, declared last with -1 so it absorbs the
# leftover instead of /var/log. preseeds/b2b-setup.sh unmounts it, drops it
# from fstab and runs `lvremove` at the end of the install, returning its
# extents to the group as free space.
#
# It is FORMATTED and MOUNTED, which looks like pointless work for something
# about to be deleted. It is not. The obvious `method{ keep }` was tried first
# and breaks the unattended install outright: with no filesystem assigned, d-i
# stops on
#     "No file system is specified for partition #1 of LVM VG LVMGroup, LV
#      spare. Go back to the menu?"
# and waits for an answer that never comes, because nothing is driving the
# console. The installer sits at that prompt until something kills it. Giving
# the volume a real filesystem is what keeps the install unattended.
#
# The result is what was wanted all along: every filesystem at its intended
# size, and ~12 GB free in the group to grow whichever one runs out:
#
#     sudo lvextend -L +5G /dev/LVMGroup/home
#     sudo resize2fs /dev/LVMGroup/home        # ext4 grows online
#
# A fixed bigger number helps once; free extents help every time.
#
# Sizes here are MB as partman counts them; the mounted size is ~93% of that
# (20480 MB → ~19 GiB), because MB→GiB is /1024 and ext4 keeps ~5% in reserve.
#
#   /        20G    — base system, apt packages
#   swap      4G    — 4x the old 1G: a 2GB VM running Docker + an LSP hit
#                     "systemd-journald: Under memory pressure" on the old size
#   /home    40G    — user data, project sources, per-user editor state
#   /opt     15G    — MACHINE-WIDE scope: /opt/nvim-*, /opt/npm-global,
#                     /opt/ai/models. Keeps machine-wide tooling off / and
#                     out of /home, where it is neither user data nor OS.
#   /var     20G    — Docker images, containers, build cache
#   /srv      2G    — service data (lighttpd, etc.)
#   /tmp      3G    — temporary files, build artifacts
#   /var/log  3G    — system + Docker logs (PINNED, see above)
#   spare    rest  — decoy, removed post-install to free its extents (see above)
d-i partman-auto/expert_recipe string \
    boot-root :: \
        1 1 1 free \
            $primary{ } \
            $bios_boot{ } \
            method{ biosgrub } \
        . \
        500 500 500 ext4 \
            $primary{ } $bootable{ } \
            method{ format } format{ } \
            use_filesystem{ } filesystem{ ext4 } \
            mountpoint{ /boot } \
        . \
        20480 20480 20480 ext4 \
            $lvmok{ } \
            lv_name{ root } \
            method{ format } format{ } \
            use_filesystem{ } filesystem{ ext4 } \
            mountpoint{ / } \
        . \
        4096 4096 4096 linux-swap \
            $lvmok{ } \
            lv_name{ swap } \
            method{ swap } format{ } \
        . \
        40960 40960 40960 ext4 \
            $lvmok{ } \
            lv_name{ home } \
            method{ format } format{ } \
            use_filesystem{ } filesystem{ ext4 } \
            mountpoint{ /home } \
        . \
        15360 15360 15360 ext4 \
            $lvmok{ } \
            lv_name{ opt } \
            method{ format } format{ } \
            use_filesystem{ } filesystem{ ext4 } \
            mountpoint{ /opt } \
        . \
        20480 20480 20480 ext4 \
            $lvmok{ } \
            lv_name{ var } \
            method{ format } format{ } \
            use_filesystem{ } filesystem{ ext4 } \
            mountpoint{ /var } \
        . \
        2048 2048 2048 ext4 \
            $lvmok{ } \
            lv_name{ srv } \
            method{ format } format{ } \
            use_filesystem{ } filesystem{ ext4 } \
            mountpoint{ /srv } \
        . \
        3072 3072 3072 ext4 \
            $lvmok{ } \
            lv_name{ tmp } \
            method{ format } format{ } \
            use_filesystem{ } filesystem{ ext4 } \
            mountpoint{ /tmp } \
        . \
        3072 3072 3072 ext4 \
            $lvmok{ } \
            lv_name{ var-log } \
            method{ format } format{ } \
            use_filesystem{ } filesystem{ ext4 } \
            mountpoint{ /var/log } \
        . \
        1024 1024 -1 ext4 \
            $lvmok{ } \
            lv_name{ spare } \
            method{ format } format{ } \
            use_filesystem{ } filesystem{ ext4 } \
            mountpoint{ /mnt/spare } \
        .

