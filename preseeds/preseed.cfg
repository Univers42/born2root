### Partitioning - FULLY AUTOMATED with Encrypted LVM
# Critical: Set automatic partitioning method
#
# ── LUKS-BEGIN ───────────────────────────────────────────────────────────────
# Everything between LUKS-BEGIN and LUKS-END is what makes the install
# encrypted. generate/create_custom_iso.sh replaces this whole region with the
# two-line plain-LVM equivalent when the ISO is built with LUKS=OFF, so the
# crypto-specific keys must all live in here and nothing else may.
#
# LUKS=ON is the default and is the only mode that satisfies the born2root
# mandatory requirement. LUKS=OFF exists to measure disk behaviour without
# encryption in the way (freed blocks stay zeroes, so the qcow2 can be
# compacted offline); never hand in a VM built that way.
#
# Do not reorder or reword the marker lines — the builder matches them exactly.
d-i partman-auto/init_automatically_partition select Guided - use entire disk and set up encrypted LVM
d-i partman-auto/method string crypto
d-i partman-crypto/passphrase password tempencrypt123
d-i partman-crypto/passphrase-again password tempencrypt123

# Skip the random data wipe — pointless in a VM (VDI is already zeroed)
# This saves 10-30+ minutes on a 32GB disk
# Both keys for compatibility: old (partman-crypto) + new trixie (partman-auto-crypto)
d-i partman-auto-crypto/erase_disks boolean false
d-i partman-crypto/erase_data boolean false

d-i partman-crypto/confirm boolean true
d-i partman-crypto/confirm_nooverwrite boolean true
# ── LUKS-END ─────────────────────────────────────────────────────────────────

# Select the disk to partition
d-i partman-auto/disk string /dev/sda

# Force the automatic partitioning
d-i partman-auto-lvm/guided_size string max
d-i partman-auto-lvm/new_vg_name string LVMGroup
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true

# Critical: Force automatic creation of partitions
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_write_new_label boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman-partitioning/confirm_write_new_label boolean true

# Set the recipe for custom partitioning
# Disk: 14GB (14336MB). Boot: 500MB. Crypto/LVM: rest of disk.
# LUKS header ≈ 16MB + LVM PE alignment → we do NOT hardcode the crypto
# container size; the installer sizes the container from the second partition
# and puts the VG inside it.
#
# ── WHY THESE NUMBERS ARE SMALL, AND WHY THAT MATTERS ───────────────────────
# The previous recipe sat on a 120 GB disk and pinned ~107 GB of volumes. The
# comment here used to say a big disk "costs nothing until it is used", because
# qcow2 is thin-provisioned. That is false for THIS machine, and the cost was
# measured: disk_images/debian/debian.qcow2 reached 42.7 GB on the host.
#
# The reason is the layer underneath. The guest is LUKS-encrypted, and dm-crypt
# drops discard requests unless the mapping is opened with allow-discards. With
# no `discard` in /etc/crypttab, no issue_discards in lvm.conf and no
# fstrim.timer, nothing the guest freed was ever handed back, so the image only
# ever grew — and because freed blocks are ciphertext rather than zeroes,
# `qemu-img convert` could not reclaim them either. A thin disk is only thin if
# something tells it what is no longer in use.
#
# preseeds/b2b-setup.sh now wires that chain up end to end. With TRIM actually
# reaching the image, the host file tracks real usage instead of high-water
# mark, and the virtual size stops being free real estate and becomes what it
# should always have been: a hard ceiling on what this VM can cost.
#
# The budget is 15 GB for the whole project (school quota), so the ceiling is
# 14 GB and `make space` fails the build if the tree exceeds it.
#
# ── WHERE THE LEFTOVER SPACE GOES ───────────────────────────────────────────
# partman insists on placing all the space somewhere. This was measured, not
# assumed: with every LV pinned and none using -1, it still handed the entire
# remainder to the LAST volume in the recipe — /var/log asked for 3072 MB and
# got 20.34 GB, with `vgs` reporting VFree = 0.
#
# The old recipe absorbed that with a decoy volume, `spare`, declared last with
# -1 and then lvremove'd post-install. It could not simply be left unformatted
# (`method{ keep }` stops the unattended install dead on "No file system is
# specified for partition #1 of LVM VG LVMGroup, LV spare"), so it was
# formatted and mounted first — and every cluster mkfs touched stayed allocated
# in the qcow2 for the life of the image, which on a LUKS disk is forever.
#
# So `spare` is gone. /var is simply declared LAST with an explicit -1 max,
# which turns partman's behaviour from a problem into the mechanism: the
# leftover lands on /var, which is exactly where Docker needs it. Nothing is
# formatted to be thrown away, and the VG ends up fully allocated by design.
#
# To grow a volume later, shrink another or enlarge the disk:
#
#     sudo lvreduce -r -L -1G /dev/LVMGroup/home
#     sudo lvextend -r -L +1G /dev/LVMGroup/var    # -r resizes the fs too
#
# Sizes here are MB as partman counts them; the mounted size is ~93% of that
# (4096 MB → ~3.8 GiB), because MB→GiB is /1024 and ext4 keeps ~5% in reserve.
# b2b-setup.sh drops that reserve to 1% on the non-root filesystems.
#
#   /       4096M  — base system, apt packages, Docker binaries
#   swap    1024M  — 2GB RAM; `discard` in fstab so freed pages are released
#   /home    768M  — user data; project sources live on the host, not here
#   /opt     512M  — MACHINE-WIDE scope: /opt/nvim-*, /opt/npm-global.
#                    Keeps machine-wide tooling off / and out of /home,
#                    where it is neither user data nor OS.
#   /srv     512M  — service data (lighttpd, etc.)
#   /tmp    1024M  — temporary files, build artifacts
#   /var/log 1024M — system + Docker logs (pinned, so logs can never eat /var)
#   /var     rest  — ~4.5G. Docker images, containers, build cache. LAST in the
#                    recipe with -1 so it absorbs the remainder (see above).
d-i partman-auto/expert_recipe string \
	boot-root :: \
	1 1 1 free \
	$primary{ } \
	$bios_boot{ } \
	method{ biosgrub } \
	. \
	500 500 500 ext4 \
	$primary{ } $bootable{ } \
	method{ format } format{ } \
	use_filesystem{ } filesystem{ ext4 } \
	mountpoint{ /boot } \
	. \
	4096 4096 4096 ext4 \
	$lvmok{ } \
	lv_name{ root } \
	method{ format } format{ } \
	use_filesystem{ } filesystem{ ext4 } \
	mountpoint{ / } \
	. \
	1024 1024 1024 linux-swap \
	$lvmok{ } \
	lv_name{ swap } \
	method{ swap } format{ } \
	. \
	768 768 768 ext4 \
	$lvmok{ } \
	lv_name{ home } \
	method{ format } format{ } \
	use_filesystem{ } filesystem{ ext4 } \
	mountpoint{ /home } \
	. \
	512 512 512 ext4 \
	$lvmok{ } \
	lv_name{ opt } \
	method{ format } format{ } \
	use_filesystem{ } filesystem{ ext4 } \
	mountpoint{ /opt } \
	. \
	512 512 512 ext4 \
	$lvmok{ } \
	lv_name{ srv } \
	method{ format } format{ } \
	use_filesystem{ } filesystem{ ext4 } \
	mountpoint{ /srv } \
	. \
	1024 1024 1024 ext4 \
	$lvmok{ } \
	lv_name{ tmp } \
	method{ format } format{ } \
	use_filesystem{ } filesystem{ ext4 } \
	mountpoint{ /tmp } \
	. \
	1024 1024 1024 ext4 \
	$lvmok{ } \
	lv_name{ var-log } \
	method{ format } format{ } \
	use_filesystem{ } filesystem{ ext4 } \
	mountpoint{ /var/log } \
	. \
	3072 3072 -1 ext4 \
	$lvmok{ } \
	lv_name{ var } \
	method{ format } format{ } \
	use_filesystem{ } filesystem{ ext4 } \
	mountpoint{ /var } \
	.

