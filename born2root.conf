# born2root.conf — the one file to edit before `make all`.
#
# Everything below used to be typed into preseeds/preseed.cfg, the two guest
# scripts, eight provisioners and seven host scripts, by hand, in ~40 places.
# Now it is read from here, once, by utils/b2b_config.sh, and expanded into
# the preseed when the ISO is built. Change a value, run `make config` to see
# the result and catch a typo before anything is downloaded, then `make all`.
#
# Format: one `KEY=value` per line, comments on their own line (a `#` after a
# value is part of the value). Quotes are optional; one surrounding pair is
# stripped. The disk is a table of `B2B_VOLUME` lines, see below. Unknown
# keys and missing keys are errors, so a misspelt line cannot pass silently.
#
# Deliberately NOT here, because the subject mandates them or because every
# host script relies on them: SSH on port 4242, the groups user42 and sudo,
# the volume group name LVMGroup, a 500 MB unencrypted /boot, ext4, LUKS, and
# the login shell. hellish is the shell of every account in every build; it
# is not a feature and has no switch.

# ── Who ─────────────────────────────────────────────────────────────────────
# The sudo user d-i creates. The subject wants your 42 login. This name is
# also the SSH user in ~/.ssh/config (`ssh b2b`) and the Inception login.
B2B_LOGIN=dlesieur
# Empty means <login>42, which is what the subject requires. Anything else is
# accepted with a warning.
B2B_HOSTNAME=
# Temporary passwords, as in the README. The evaluation expects you to change
# them in the guest (`passwd`); the policy installed there wants 10+ chars
# with upper, lower and a digit. They reach the ISO as SHA-512 hashes.
B2B_USER_PASSWORD=tempuser123
B2B_ROOT_PASSWORD=temproot123
# Typed into the guest's virtual keyboard by the host at every boot, so only
# characters the QEMU monitor can name: letters, digits and - _ . , / = + ! @
# # $ % & * ? : ;  (8 or more). VM_PASS in the environment overrides it, for
# the ISO and for the unlock alike.
B2B_LUKS_PASSPHRASE=tempencrypt123
# More accounts, space separated: name:password or name:password:sudo. Each
# lands in user42 (and sudo when asked), with hellish and its configuration
# as login shell. No SSH key, no editor setup: those are the login user's.
# Passwords here cannot contain ':' or spaces.
B2B_EXTRA_USERS=

# ── Where ───────────────────────────────────────────────────────────────────
B2B_LOCALE=en_US.UTF-8
# Console keymap (d-i's keyboard-configuration/xkb-keymap): es, us, fr, de…
B2B_KEYMAP=es
B2B_TIMEZONE=Europe/Madrid
# Debian mirror, host name only (the preseed and the guest's sources.list).
B2B_MIRROR=deb.debian.org

# ── Disk ────────────────────────────────────────────────────────────────────
# One line per logical volume:  B2B_VOLUME name mount floor share cap
#   floor   MB the volume always gets (a working Debian fits on 8 GB)
#   share   % of what is left over the floors, or `rest` for the volume that
#           takes the remainder (exactly one; partman inflates the last volume
#           anyway, so that is where the leftover is wanted: Docker lives in
#           /var). Shares need not sum to 100; what they leave goes to `rest`.
#   cap     MB it never grows past, or `-` for no cap
# Remove a line to fold that mount into `/` (the fit check follows), add one
# to carve out another mount. `make partitions` previews the result for the
# disk size; `make features` checks the install set still fits it.
B2B_VOLUME  root     /          2816   25    30720
B2B_VOLUME  home     /home       512   18   102400
B2B_VOLUME  opt      /opt        256    5    20480
B2B_VOLUME  srv      /srv        256    0    10240
B2B_VOLUME  tmp      /tmp        256    3    10240
B2B_VOLUME  var-log  /var/log    384    3    20480
B2B_VOLUME  var      /var       2048  rest        -
# auto = the guest's RAM clamped to [1024, 4096] MB and to a quarter of the
# group; or a number of MB.
B2B_SWAP_MB=auto

# ── Build ───────────────────────────────────────────────────────────────────
# Defaults for the Makefile. The command line and the environment still win:
# `make all SIZE_B2B=30` builds a 30 GB disk whatever is written here.
# Disk size in GB, the school quota. Everything else is derived from it.
B2B_SIZE_GB=15
# Guest RAM in MB. Empty = a quarter of the host's, clamped to [2048, 8192].
B2B_VM_RAM_MB=
B2B_VM_NAME=debian
# auto | virtualbox | qemu
B2B_BACKEND=auto
# auto | minimal | standard | full  (auto follows the disk size)
B2B_PROFILE=auto
# Per-feature overrides such as "+docker -pytools" (`make features` lists
# them). A non-empty value is a stated choice: the interactive picker is
# skipped.
B2B_FEATURES=
# off | client | local
B2B_AI_MODE=off
