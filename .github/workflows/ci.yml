name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop", "feat/*" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  linting:
    name: Linting Phase (Fail-Fast)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (for markdownlint)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          # bashate
          pip install bashate
          # shfmt
          sudo snap install shfmt
          # markdownlint
          npm install -g markdownlint-cli@0.49.1
          # shellcheck (usually pre-installed, but ensuring latest)
          sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: |
          echo "Running ShellCheck on all .sh files..."
          find . -type f -name "*.sh" -print0 | xargs -0 shellcheck --color=always -e SC1091

      - name: Run Bashate
        if: always()
        run: |
          echo "Running Bashate on all .sh files..."
          find . -type f -name "*.sh" -exec bashate -i E006 {} +

      - name: Run shfmt (Dry-run/Diff)
        if: always()
        run: |
          echo "Running shfmt to check formatting..."
          find . -type f -name "*.sh" -exec shfmt -d -i 4 {} +

      - name: Run Markdownlint
        if: always()
        run: |
          echo "Running Markdownlint..."
          markdownlint "**/*.md"

  build-test:
    name: Build Phase (Dry-Run & ISO)
    runs-on: ubuntu-latest
    needs: linting
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Makefile (Dry-Run)
        run: |
          echo "Running make --dry-run all..."
          make --dry-run all

      - name: Install Host Dependencies (make deps)
        run: |
          echo "Running make deps with CI=true..."
          CI=true make deps

      # The partition recipe sizes swap from VM_RAM_MB, and the Makefile's
      # default is 25% of the HOST's RAM. A 80 GB runner asked for a 20 GB
      # swap, which left /opt, /var and /home too small for the 'standard'
      # profile on the 15 GB default disk ("fits from SIZE_B2B=17"). The ISO
      # does not depend on the runner, so pin the RAM the shipped VM uses:
      # 2048 MB fits at 15 GB, 4096 does not.
      - name: Build Custom ISO
        env:
          VM_RAM_MB: "2048"
        run: |
          echo "Running make gen_iso..."
          make gen_iso
