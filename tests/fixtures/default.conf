# The shipped defaults of born2root.conf, without its comments. Tests pin
# this copy so a personalised born2root.conf cannot change what they assert.
# Change a default in both files; the RECIPE block of preseeds/preseed.cfg.in
# is generated from this one (bash generate/partition_recipe.sh --recipe).
B2B_LOGIN=dlesieur
B2B_HOSTNAME=
B2B_USER_PASSWORD=tempuser123
B2B_ROOT_PASSWORD=temproot123
B2B_LUKS_PASSPHRASE=tempencrypt123
B2B_EXTRA_USERS=
B2B_LOCALE=en_US.UTF-8
B2B_KEYMAP=es
B2B_TIMEZONE=Europe/Madrid
B2B_MIRROR=deb.debian.org
B2B_VOLUME  root     /          2816   25    30720
B2B_VOLUME  home     /home       512   18   102400
B2B_VOLUME  opt      /opt        256    5    20480
B2B_VOLUME  srv      /srv        256    0    10240
B2B_VOLUME  tmp      /tmp        256    3    10240
B2B_VOLUME  var-log  /var/log    384    3    20480
B2B_VOLUME  var      /var       2048  rest        -
B2B_SWAP_MB=auto
B2B_SIZE_GB=15
B2B_VM_RAM_MB=
B2B_VM_NAME=debian
B2B_BACKEND=auto
B2B_PROFILE=auto
B2B_FEATURES=
B2B_AI_MODE=off
